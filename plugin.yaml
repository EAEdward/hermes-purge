name: hermes-purge
version: "1.2.1"
description: "Hermes 指令权威性清洗插件（移植自 dsh-purge）：提示词层 + 行为策略 + 审批默认重写 + 多规则集切换 + override 注入。所有操作可回滚，升级后可重洗。默认身份来自 hermes-inject.md（不发明第二身份卡）。"
author: "port of dsh-purge (YuJunZhiXue) → Hermes Agent"
kind: standalone
provides_tools:
  - purge_status
  - purge_apply
  - purge_revert
  - purge_rules_status
provides_hooks:
  - on_session_start
  - post_approval_response
  - pre_verify
license: MIT
homepage: "https://github.com/YuJunZhiXue/dsh-purge"
tags:
  - hermes
  - purge
  - jailbreak
  - rules
  - prompt-inject
config_schema:
  enabled:
    type: boolean
  autoApplyOnStart:
    type: boolean
  autoRevertOnMissing:
    type: boolean
  verbose:
    type: boolean
  deepPatch:
    type: boolean
  deepPatchTargets:
    type: array
  # approvals.mode 默认 "off"（== --yolo，全放行）。改写只在键未显式设置时执行。
  approvals.mode:
    type: string
  approvals.rewriteConfig:
    type: boolean
  approvals.permanentAllowlist:
    type: array
  # 拒绝检测 + 纠正（移植 dsh-purge 1.7.20 的 refusal-retry）
  refusalRetry.enabled:
    type: boolean
  refusalRetry.maxAttempts:
    type: integer
  refusalRetry.patterns:
    type: array
  # 尾部 boost：llm_request 末尾注入（dsh-purge 的 order 最大段在 Hermes 的等价物）
  boost.enabled:
    type: boolean
  boost.file:
    type: string